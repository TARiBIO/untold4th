<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Page</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body, button, a {
    cursor: url('assets/cursor.svg') 8 8,
            url('assets/cursor.png') 8 8,
            pointer;
  }
  .product-page {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
    display: flex;
    gap: 40px;
  }
  .product-info h1 { margin-bottom: 10px; }
  .sizes button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #999;
    background: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    font-weight: 600;
  }
  .sizes button.active {
    background: black;
    color: white;
  }
  .product-info .btn {
    margin-top: 15px;
  }
  .ai-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 80;
  }
  .ai-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .ai-modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    padding: 32px;
    width: min(420px, 90%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 90;
  }
  .ai-modal.open {
    opacity: 1;
    pointer-events: all;
    transform: translate(-50%, -50%);
  }
  .ai-modal h3 {
    margin-top: 0;
    margin-bottom: 8px;
  }
  .ai-modal .ai-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 16px 0;
  }
  .ai-modal .ai-options button {
    border: 1px solid #111;
    border-radius: 999px;
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    cursor: pointer;
    background: #fff;
  }
  .ai-modal .ai-options button:hover {
    background: #111;
    color: #fff;
  }
  .ai-modal .ai-result {
    margin-top: 14px;
    font-size: 14px;
    color: var(--muted, #555);
  }
  .ai-form {
    margin-top: 12px;
    border-top: 1px solid #eee;
    padding-top: 12px;
  }
  .ai-form .ai-field {
    margin-bottom: 12px;
  }
  .ai-form label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 4px;
    color: #3f3529;
  }
  .ai-form input[type="number"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    color: #2a241c;
  }
  .ai-form input[type="number"]::placeholder {
    color: #a5a0a0;
  }
  .ai-form input[type="file"] {
    width: 100%;
    border: none;
    padding: 0;
    background: transparent;
  }
  .ai-form input[type="file"]::file-selector-button,
  .ai-form input[type="file"]::-webkit-file-upload-button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    background: #c9b58b;
    color: #000;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.3s ease, transform 0.2s ease;
  }
  .ai-form input[type="file"]::file-selector-button:hover,
  .ai-form input[type="file"]::-webkit-file-upload-button:hover {
    opacity: 0.9;
  }
  .ai-form .hidden {
    display: none;
  }
  .ai-status {
    font-size: 13px;
    color: #3f3529;
    margin-top: 8px;
  }
</style>
<script>
  window.AI_BACKEND_URL = window.AI_BACKEND_URL || 'http://localhost:8000';
</script>
</head>

<body data-theme="default">

<header id="site-header" style="position: relative; width: 100%; z-index: 10;">
  <div class="container header-row">
    <a class="logo" href="index.html">
      <img src="your-logo.png" alt="Untold 4th logo">
    </a>
    <div class="controls">
      <button class="icon-btn" id="cartBtn">
        <i class="fas fa-shopping-bag"></i>
        <span id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<div class="product-page">
  
  <!-- Image -->
  <div class="product-image">
    <img id="productImg" src="" style="width:400px;border-radius:10px;">
  </div>

  <!-- Details -->
  <div class="product-info">
    <h1 id="productName"></h1>
    <p id="productPrice" style="font-size:20px;font-weight:600;"></p>

    <h3>Select Size</h3>
    <div class="sizes" id="sizeOptions">
      <button type="button" data-size="XS">XS</button>
      <button type="button" data-size="S">S</button>
      <button type="button" data-size="M">M</button>
      <button type="button" data-size="L">L</button>
      <button type="button" data-size="XL">XL</button>
    </div>

    <button class="btn" id="aiAssistBtn" onclick="aiAssist()">AI Assist: Find My Size</button>
    <button class="btn addCartBtn" onclick="addToCart()">Add to Cart</button>
  </div>
</div>

<!-- Cart overlay/panel for consistency -->
<div id="cartOverlay" class="cart-overlay"></div>
<aside id="cartPanel" class="cart-panel" aria-hidden="true">
  <div class="cart-header">
    <strong>Your Bag</strong>
    <button class="close-cart icon-btn" aria-label="Close cart"><i class="fas fa-times"></i></button>
  </div>
  <div id="cartList">
    <div class="empty">Your bag is empty.</div>
  </div>
  <div class="cart-footer">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <div style="color:var(--muted)">Subtotal</div>
      <div id="cartSubtotal" style="font-weight:700">$0.00</div>
    </div>
    <div style="margin-top:12px;display:flex;gap:10px">
      <button class="btn" id="checkoutBtn">Checkout</button>
      <button class="btn secondary" id="clearCartBtn">Clear</button>
    </div>
  </div>
</aside>

<div id="aiOverlay" class="ai-overlay"></div>
<div id="aiModal" class="ai-modal" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle" aria-describedby="aiModalDesc">
  <button class="icon-btn close-cart" id="closeAiModal" aria-label="Close AI assist" style="position:absolute;top:12px;right:12px">
    <i class="fas fa-times"></i>
  </button>
  <h3 id="aiModalTitle" style="color:grey">AI Fit Assist</h3>
  <p id="aiModalDesc" style="color:grey">Tell us how you want to find your fit.</p>
  <div class="ai-options">
    <button type="button" data-mode="upload">Option A — Upload Photo</button>
    <button type="button" data-mode="metrics">Option B — Height / Weight</button>
    <button type="button" data-mode="both">Option C — Both</button>
  </div>
  <div class="ai-result" id="aiResult" style="color:grey">Pick an option to get a tailored recommendation.</div>
  <form id="aiAssistForm" class="ai-form hidden">
    <div class="ai-field hidden" data-requires="upload both" id="aiUploadField">
      <label for="aiPhotoInput">Upload Reference Photo</label>
      <input type="file" id="aiPhotoInput" accept="image/*">
    </div>
    <div class="ai-field hidden" data-requires="metrics both" id="aiMetricsField">
      <label for="aiHeightInput">Height (cm)</label>
      <input type="number" id="aiHeightInput" min="120" max="220" step="1" placeholder="e.g. 178">
      <label for="aiWeightInput" style="margin-top:8px">Weight (kg)</label>
      <input type="number" id="aiWeightInput" min="40" max="150" step="1" placeholder="e.g. 75">
    </div>
    <button type="submit" class="btn addCartBtn" style="width:100%">Analyze & Auto-Select Size</button>
    <div class="ai-status" id="aiStatus"></div>
  </form>
</div>

<script src="js/scripts.js" defer></script>
<script src="js/config.js"></script>
<script src="product.js"></script>

</body>
</html>
